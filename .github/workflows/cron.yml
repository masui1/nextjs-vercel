name: Keep Supabase Alive

on:
  schedule:
    # 毎日 日本時間 9:00 (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行用ボタンも有効化

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up website and database
        run: |
          # サイトにアクセスしてDB接続を発生させる
          curl -I https://nextjs-vercel-sigma-ten.vercel.app/
